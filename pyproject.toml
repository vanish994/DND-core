[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
"rule_engine/bestiary.py" = ["E402"]
"rule_engine/spells.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["orchestrator", "rule_engine"]

[tool.coverage.report]
show_missing = true
skip_covered = false
